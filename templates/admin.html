<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a1a2e; 
            color: #eee; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 24px; 
            padding-bottom: 16px; 
            border-bottom: 1px solid #333; 
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 { color: #e94560; font-size: 24px; }
        .header a { color: #66aaff; text-decoration: none; }
        .header .user-info { color: #888; font-size: 14px; }

        .stats { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 16px; 
            margin-bottom: 24px; 
        }
        .stats .card { 
            background: #16213e; 
            padding: 16px 20px; 
            border-radius: 12px; 
            border-left: 4px solid #e94560; 
        }
        .stats .card .num { font-size: 28px; font-weight: bold; color: #e94560; }
        .stats .card .label { font-size: 13px; color: #888; margin-top: 4px; }

        .tabs { 
            display: flex; 
            gap: 4px; 
            margin-bottom: 20px; 
            background: #16213e; 
            border-radius: 10px; 
            padding: 4px; 
            flex-wrap: wrap;
        }
        .tabs button { 
            padding: 10px 24px; 
            border: none; 
            border-radius: 8px; 
            background: transparent; 
            color: #888; 
            cursor: pointer; 
            font-size: 14px; 
            transition: 0.3s; 
        }
        .tabs button:hover { color: #eee; }
        .tabs button.active { background: #0f3460; color: #fff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .table-wrapper {
            overflow-x: auto;
            background: #16213e;
            border-radius: 12px;
            padding: 4px 0;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 500px;
        }
        th { 
            background: #0f3460; 
            padding: 12px 16px; 
            text-align: left; 
            font-size: 13px; 
            color: #aaa; 
            white-space: nowrap;
        }
        td { 
            padding: 10px 16px; 
            border-bottom: 1px solid #1a2a4a; 
            font-size: 14px; 
            word-break: break-word;
        }
        tr:hover td { background: #1a2a4a; }

        .btn { 
            padding: 4px 14px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 12px; 
            transition: 0.3s; 
        }
        .btn-danger { background: #e94560; color: #fff; }
        .btn-danger:hover { background: #c73652; }
        .btn-success { background: #0f8a5a; color: #fff; }
        .btn-success:hover { background: #0f6b4a; }
        .btn-refresh { background: #2a65ff; color: #fff; }
        .btn-refresh:hover { background: #1a4fd6; }

        .badge { padding: 2px 10px; border-radius: 12px; font-size: 11px; display: inline-block; }
        .badge-admin { background: #e94560; color: #fff; }
        .badge-banned { background: #cc3344; color: #fff; }
        .badge-normal { background: #2a4a6a; color: #aaa; }
        .badge-room { background: #2a65ff; color: #fff; }

        .search-box { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 16px; 
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box input { 
            flex: 1; 
            min-width: 150px;
            padding: 8px 14px; 
            border: none; 
            border-radius: 8px; 
            background: #1a2a4a; 
            color: #eee; 
            font-size: 14px; 
            outline: none; 
        }
        .search-box input::placeholder { color: #6688aa; }

        .empty { text-align: center; padding: 40px; color: #666; }

        .toast { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background: #0f3460; 
            padding: 12px 24px; 
            border-radius: 10px; 
            color: #fff; 
            font-size: 14px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.4); 
            display: none; 
            z-index: 100; 
            max-width: 90%;
        }
        .toast.show { display: block; animation: fadeIn 0.3s; }
        .toast.error { background: #cc3344; }
        .toast.success { background: #0f8a5a; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6688aa;
        }

        .room-info {
            background: #16213e;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid #2a65ff;
            flex-wrap: wrap;
        }
        .room-info .label { color: #888; font-size: 13px; }
        .room-info .name { color: #fff; font-size: 16px; font-weight: bold; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) { 
            .stats { grid-template-columns: 1fr 1fr; }
            .header { flex-direction: column; align-items: flex-start; }
            .tabs button { padding: 8px 14px; font-size: 13px; }
            th, td { padding: 8px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部导航 -->
    <div class="header">
        <h1>🔧 管理后台</h1>
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
            <a href="/">← 返回聊天室</a>
            <span class="user-info" id="adminName">👤 管理员：加载中...</span>
            <button class="btn btn-refresh" onclick="loadAll()">🔄 刷新数据</button>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats" id="stats">
        <div class="card"><div class="num" id="totalUsers">-</div><div class="label">总用户</div></div>
        <div class="card"><div class="num" id="totalAdmins">-</div><div class="label">管理员</div></div>
        <div class="card"><div class="num" id="totalBanned">-</div><div class="label">已封禁</div></div>
        <div class="card"><div class="num" id="totalMessages">-</div><div class="label">总消息</div></div>
    </div>

    <!-- Tab切换 -->
    <div class="tabs">
        <button class="active" data-tab="users">👥 用户管理</button>
        <button data-tab="messages">💬 消息记录</button>
    </div>

    <!-- 用户管理 -->
    <div id="tab-users" class="tab-content active">
        <div class="search-box">
            <input type="text" id="userSearch" placeholder="搜索用户名..." oninput="filterUsers()">
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>
                <tbody id="userTableBody"><tr><td colspan="6" class="loading">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- 消息记录 -->
    <div id="tab-messages" class="tab-content">
        <div class="room-info">
            <span class="label">📌 当前房间：</span>
            <span class="name badge badge-room">public</span>
            <span style="color:#888;font-size:13px;margin-left:8px;">（唯一聊天室）</span>
            <span style="color:#888;font-size:13px;margin-left:8px;" id="msgCount"></span>
        </div>
        <div class="search-box">
            <input type="text" id="msgSearch" placeholder="搜索消息内容..." oninput="filterMessages()">
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>ID</th><th>用户</th><th>消息内容</th><th>时间</th><th>操作</th></tr></thead>
                <tbody id="msgTableBody"><tr><td colspan="5" class="loading">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    // ============================================================
    //  配置
    // ============================================================
    const API_BASE = '/api';

    // ============================================================
    //  数据
    // ============================================================
    let users = [];
    let messages = [];
    let currentAdmin = '';

    // ============================================================
    //  加载数据
    // ============================================================
    async function loadAll() {
        showToast('🔄 正在加载数据...');
        try {
            const usersRes = await fetch(`${API_BASE}/users`);
            if (usersRes.ok) {
                users = await usersRes.json();
            }

            const msgRes = await fetch(`${API_BASE}/messages/public`);
            if (msgRes.ok) {
                messages = await msgRes.json();
            }

            try {
                const meRes = await fetch(`${API_BASE}/me`);
                if (meRes.ok) {
                    const me = await meRes.json();
                    currentAdmin = me.username || '管理员';
                }
            } catch(e) {
                currentAdmin = '管理员';
            }

            renderAll();
            showToast('✅ 数据已更新', false, 'success');
        } catch (error) {
            console.error('加载失败:', error);
            showToast('⚠️ 加载失败', true);
            renderAll();
        }
    }

    // ============================================================
    //  渲染
    // ============================================================

    function renderStats() {
        const total = users.length;
        const admins = users.filter(u => u.is_admin).length;
        const banned = users.filter(u => u.is_banned).length;
        document.getElementById('totalUsers').textContent = total;
        document.getElementById('totalAdmins').textContent = admins;
        document.getElementById('totalBanned').textContent = banned;
        document.getElementById('totalMessages').textContent = messages.length;
        document.getElementById('adminName').textContent = `👤 管理员：${currentAdmin || '未知'}`;
        document.getElementById('msgCount').textContent = `共 ${messages.length} 条消息`;
    }

    function renderUsers() {
        const search = document.getElementById('userSearch').value.toLowerCase();
        const filtered = users.filter(u => u.username && u.username.toLowerCase().includes(search));
        const tbody = document.getElementById('userTableBody');
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无用户</td></tr>';
            return;
        }
        tbody.innerHTML = filtered.map(u => `
            <tr>
                <td>${u.id || '-'}</td>
                <td><strong>${u.username || '未知'}</strong></td>
                <td>${u.is_admin ? '<span class="badge badge-admin">管理员</span>' : '普通用户'}</td>
                <td>${u.is_banned ? '<span class="badge badge-banned">已封禁</span>' : '<span class="badge badge-normal">正常</span>'}</td>
                <td>${u.created_at || '-'}</td>
                <td>
                    ${u.is_admin ? '<span style="color:#888;">不可操作</span>' : 
                      (u.is_banned ? 
                        `<button class="btn btn-success" onclick="unbanUser(${u.id})">解封</button>` :
                        `<button class="btn btn-danger" onclick="banUser(${u.id})">封禁</button>`
                      )}
                </td>
            </tr>
        `).join('');
    }

    function filterUsers() { renderUsers(); }

    function renderMessages() {
        const search = document.getElementById('msgSearch').value.toLowerCase();
        const filtered = messages.filter(m => {
            return m.content && m.content.toLowerCase().includes(search);
        });
        const tbody = document.getElementById('msgTableBody');
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无消息</td></tr>';
            return;
        }
        const display = [...filtered].reverse().slice(0, 200);
        tbody.innerHTML = display.map(m => `
            <tr>
                <td>${m.id || '-'}</td>
                <td><strong>${m.username || '匿名'}</strong></td>
                <td style="max-width:400px;word-wrap:break-word;">${escapeHtml(m.content || '')}</td>
                <td>${m.timestamp || '-'}</td>
                <td>
                    <button class="btn btn-danger" onclick="deleteMessage(${m.id})">删除</button>
                </td>
            </tr>
        `).join('');
    }

    function filterMessages() { renderMessages(); }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderAll() {
        renderStats();
        renderUsers();
        renderMessages();
    }

    // ============================================================
    //  操作函数（修正API路径）
    // ============================================================

    async function banUser(id) {
        if (!confirm('确认封禁该用户？')) return;
        try {
            const res = await fetch(`${API_BASE}/ban/${id}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                showToast('✅ 已封禁用户', false, 'success');
                loadAll();
            } else {
                showToast('⚠️ 封禁失败: ' + (data.error || '未知错误'), true);
            }
        } catch (e) {
            showToast('⚠️ 请求失败', true);
        }
    }

    async function unbanUser(id) {
        try {
            const res = await fetch(`${API_BASE}/unban/${id}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                showToast('✅ 已解封用户', false, 'success');
                loadAll();
            } else {
                showToast('⚠️ 解封失败: ' + (data.error || '未知错误'), true);
            }
        } catch (e) {
            showToast('⚠️ 请求失败', true);
        }
    }

    // ===== 删除消息 - 修正API路径 =====
    async function deleteMessage(id) {
        if (!confirm('确认删除该消息？此操作不可撤销！')) return;
        try {
            // 尝试不同的API路径
            let url = `${API_BASE}/messages/public/${id}`;
            let res = await fetch(url, { method: 'DELETE' });
            
            // 如果失败，尝试另一种路径
            if (!res.ok) {
                url = `${API_BASE}/message/${id}`;
                res = await fetch(url, { method: 'DELETE' });
            }
            
            // 如果还失败，尝试带房间参数
            if (!res.ok) {
                url = `${API_BASE}/messages?room=public&id=${id}`;
                res = await fetch(url, { method: 'DELETE' });
            }

            if (res.ok) {
                const data = await res.json();
                if (data.success !== false) {
                    showToast('✅ 已删除消息', false, 'success');
                    loadAll();
                    return;
                }
            }
            
            // 如果所有API都失败，尝试本地删除
            const idx = messages.findIndex(m => m.id === id);
            if (idx !== -1) {
                messages.splice(idx, 1);
                renderAll();
                showToast('✅ 已本地删除（服务器未响应）', false, 'success');
            } else {
                showToast('⚠️ 删除失败: 找不到该消息', true);
            }
        } catch (e) {
            // 降级：本地删除
            const idx = messages.findIndex(m => m.id === id);
            if (idx !== -1) {
                messages.splice(idx, 1);
                renderAll();
                showToast('✅ 已本地删除（网络错误）', false, 'success');
            } else {
                showToast('⚠️ 删除失败: ' + e.message, true);
            }
        }
    }

    // ============================================================
    //  Toast
    // ============================================================
    function showToast(msg, isError = false, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast';
        if (isError) t.classList.add('error');
        if (type === 'success') t.classList.add('success');
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 4000);
    }

    // ============================================================
    //  Tab切换
    // ============================================================
    document.querySelectorAll('.tabs button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.getElementById('tab-' + this.dataset.tab).classList.add('active');
        });
    });

    // ============================================================
    //  自动刷新
    // ============================================================
    let autoRefreshTimer = null;

    function startAutoRefresh() {
        if (autoRefreshTimer) clearInterval(autoRefreshTimer);
        autoRefreshTimer = setInterval(() => {
            refreshSilent();
        }, 10000);
    }

    async function refreshSilent() {
        try {
            const usersRes = await fetch(`${API_BASE}/users`);
            if (usersRes.ok) users = await usersRes.json();
            const msgRes = await fetch(`${API_BASE}/messages/public`);
            if (msgRes.ok) messages = await msgRes.json();
            renderAll();
        } catch(e) {}
    }

    // ============================================================
    //  初始化
    // ============================================================
    loadAll();
    startAutoRefresh();
    console.log('✅ 管理后台已加载');
</script>
</body>
</html>
