<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 聊天室</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #eee;
        }
        .container {
            background: #16213e;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .container h1 {
            text-align: center;
            color: #e94560;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .container .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #1a2a4a;
            color: #eee;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            background: #0f3460;
            box-shadow: 0 0 0 2px #e94560;
        }
        .form-group input::placeholder { color: #6688aa; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #e94560;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover { background: #c73652; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .toggle-mode {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #888;
        }
        .toggle-mode a {
            color: #66aaff;
            text-decoration: none;
            cursor: pointer;
        }
        .toggle-mode a:hover { text-decoration: underline; }
        .error-msg {
            background: #cc3344;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.show { display: block; }
        .success-msg {
            background: #0f8a5a;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .success-msg.show { display: block; }
        .default-hint {
            text-align: center;
            font-size: 12px;
            color: #555;
            margin-top: 12px;
            border-top: 1px solid #1a2a4a;
            padding-top: 12px;
        }
        .default-hint code {
            background: #1a2a4a;
            padding: 2px 8px;
            border-radius: 4px;
            color: #66aaff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 聊天室</h1>
        <div class="subtitle" id="modeTitle">登录账号</div>
        
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <form id="authForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="submitBtn">登录</button>
        </form>

        <div class="toggle-mode">
            <span id="toggleText">还没有账号？</span>
            <a id="toggleLink" onclick="toggleMode()">注册新账号</a>
        </div>

        <div class="default-hint">
            👤 默认管理员：<code>yingMC</code>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('modeTitle');
            const btn = document.getElementById('submitBtn');
            const toggleText = document.getElementById('toggleText');
            const toggleLink = document.getElementById('toggleLink');
            
            if (isLoginMode) {
                title.textContent = '登录账号';
                btn.textContent = '登录';
                toggleText.textContent = '还没有账号？';
                toggleLink.textContent = '注册新账号';
            } else {
                title.textContent = '注册新账号';
                btn.textContent = '注册';
                toggleText.textContent = '已有账号？';
                toggleLink.textContent = '去登录';
            }
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('successMsg').classList.remove('show');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const btn = document.getElementById('submitBtn');

            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            if (!username || !password) {
                errorMsg.textContent = '请填写用户名和密码';
                errorMsg.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.textContent = '处理中...';

            try {
                const endpoint = isLoginMode ? '/api/login' : '/api/register';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    if (isLoginMode) {
                        successMsg.textContent = '✅ 登录成功，正在跳转...';
                        successMsg.classList.add('show');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 500);
                    } else {
                        successMsg.textContent = '✅ 注册成功，请登录';
                        successMsg.classList.add('show');
                        if (!isLoginMode) toggleMode();
                        document.getElementById('username').value = '';
                        document.getElementById('password').value = '';
                    }
                } else {
                    errorMsg.textContent = data.error || '操作失败，请重试';
                    errorMsg.classList.add('show');
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请检查连接';
                errorMsg.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = isLoginMode ? '登录' : '注册';
            }
        }
    </script>
</body>
</html>
