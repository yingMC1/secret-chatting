<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 登录 · 聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0e1219;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .auth-container {
            background: #181f2b;
            border-radius: 32px;
            padding: 40px 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-header h1 {
            color: #f0f4fa;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .auth-header h1 span {
            color: #5b8cbf;
        }
        .auth-header p {
            color: #8aa1bc;
            font-size: 14px;
            margin-top: 6px;
        }
        .auth-tabs {
            display: flex;
            gap: 8px;
            background: #1f2a3a;
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 28px;
        }
        .auth-tabs button {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 30px;
            background: transparent;
            color: #8aa1bc;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .auth-tabs button.active {
            background: #2b6f9c;
            color: #fff;
            box-shadow: 0 4px 12px rgba(43, 111, 156, 0.3);
        }
        .auth-tabs button:hover:not(.active) {
            color: #d6e3f0;
        }
        .auth-form {
            display: block;
        }
        .auth-form.hidden {
            display: none;
        }
        .auth-form .form-group {
            margin-bottom: 18px;
        }
        .auth-form label {
            display: block;
            color: #b0c8e0;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .auth-form input {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 30px;
            background: #1f2a3a;
            color: #e5edf5;
            font-size: 15px;
            outline: none;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .auth-form input:focus {
            background: #283649;
            box-shadow: 0 0 0 2px #3b6a94;
        }
        .auth-form input::placeholder {
            color: #5e748e;
        }
        .auth-form .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            background: #2b6f9c;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 6px;
        }
        .auth-form .btn-primary:hover {
            background: #3b86b8;
        }
        .auth-form .btn-primary:active {
            transform: scale(0.97);
        }
        .auth-form .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #4d657f;
            font-size: 13px;
        }
        .auth-footer a {
            color: #5b8cbf;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .default-admin {
            margin-top: 18px;
            padding: 14px;
            background: #1f2a3a;
            border-radius: 16px;
            text-align: center;
            color: #8aa1bc;
            font-size: 13px;
            border: 1px dashed #2a3648;
        }
        .default-admin strong {
            color: #b07cd8;
        }
        @media (max-width: 480px) {
            .auth-container {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>💬 <span>聊天室</span></h1>
            <p>登录 或 注册 开始聊天</p>
        </div>

        <!-- Tab 切换 -->
        <div class="auth-tabs">
            <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
            <button id="tabRegister" onclick="switchTab('register')">注册</button>
        </div>

        <!-- 登录表单 -->
        <div id="loginForm" class="auth-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="输入用户名" autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="输入密码">
            </div>
            <button class="btn-primary" onclick="login()">登 录</button>
            <div id="loginError" class="error-msg"></div>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" class="auth-form hidden">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="设置用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="设置密码">
            </div>
            <button class="btn-primary" onclick="register()">注 册</button>
            <div id="regError" class="error-msg"></div>
        </div>

        <!-- 默认管理员信息 -->
        <div class="default-admin">
            👤 默认管理员：<strong>yingMC</strong> &nbsp;|&nbsp; 密码：<strong>ying@akioi&1101</strong>
        </div>

        <div class="auth-footer">
            使用即表示您同意遵守社区规范
        </div>
    </div>

    <script>
        // ===== 设备 ID 管理 =====
        function getDeviceId() {
            let id = localStorage.getItem('deviceId');
            if (!id) {
                id = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    var r = Math.random() * 16 | 0,
                        v = c == 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
                localStorage.setItem('deviceId', id);
            }
            return id;
        }

        // ===== Tab 切换 =====
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                document.getElementById('loginError').textContent = '';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                document.getElementById('regError').textContent = '';
            }
        }

        // ===== 登录 =====
        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = '请填写用户名和密码';
                return;
            }

            errorEl.textContent = '登录中...';

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorEl.textContent = data.error || '登录失败，请重试';
                }
            })
            .catch(err => {
                errorEl.textContent = '网络错误，请稍后重试';
            });
        }

        // ===== 注册 =====
        function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const errorEl = document.getElementById('regError');

            if (!username || !password) {
                errorEl.textContent = '请填写用户名和密码';
                return;
            }
            if (username.length < 2) {
                errorEl.textContent = '用户名至少2个字符';
                return;
            }
            if (password.length < 4) {
                errorEl.textContent = '密码至少4个字符';
                return;
            }

            const device_id = getDeviceId();

            errorEl.textContent = '注册中...';

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, device_id })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    errorEl.textContent = '✅ 注册成功！请切换到登录';
                    errorEl.style.color = '#7fd1b0';
                    document.getElementById('regUsername').value = '';
                    document.getElementById('regPassword').value = '';
                    // 自动切换到登录
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('loginUsername').value = username;
                        document.getElementById('loginPassword').focus();
                        errorEl.style.color = '#ff6b6b';
                    }, 1200);
                } else {
                    errorEl.textContent = data.error || '注册失败，请重试';
                    errorEl.style.color = '#ff6b6b';
                }
            })
            .catch(err => {
                errorEl.textContent = '网络错误，请稍后重试';
                errorEl.style.color = '#ff6b6b';
            });
        }

        // ===== 按回车触发登录/注册 =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const activeForm = document.querySelector('.auth-form:not(.hidden)');
                if (activeForm) {
                    if (activeForm.id === 'loginForm') {
                        login();
                    } else if (activeForm.id === 'registerForm') {
                        register();
                    }
                }
            }
        });

        // 小提示：点击默认管理员信息可快速填充登录框（方便测试）
        document.querySelector('.default-admin')?.addEventListener('click', function() {
            document.getElementById('loginUsername').value = 'yingMC';
            document.getElementById('loginPassword').value = 'ying@akioi&1101';
            switchTab('login');
        });
    </script>
</body>
</html>
