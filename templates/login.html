<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 聊天室</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #16213e; padding: 48px 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .login-box h1 { color: #e94560; text-align: center; margin-bottom: 8px; font-size: 28px; }
        .login-box .sub { color: #888; text-align: center; margin-bottom: 32px; font-size: 14px; }
        .login-box label { color: #aaa; font-size: 13px; display: block; margin-bottom: 4px; }
        .login-box input { width: 100%; padding: 12px 16px; border: none; border-radius: 8px; background: #1a2a4a; color: #eee; font-size: 14px; margin-bottom: 16px; outline: none; }
        .login-box input:focus { border: 2px solid #e94560; }
        .login-box .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #e94560; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-box .btn:hover { background: #c73652; }
        .login-box .switch { text-align: center; margin-top: 16px; color: #888; font-size: 13px; }
        .login-box .switch a { color: #66aaff; cursor: pointer; text-decoration: none; }
        .login-box .switch a:hover { text-decoration: underline; }
        .login-box .error { background: #cc3344; color: #fff; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 13px; }
    </style>
</head>
<body>
<div class="login-box">
    <h1>💬 聊天室</h1>
    <p class="sub" id="formTitle">登录你的账号</p>
    <div class="error" id="errorMsg"></div>
    
    <form id="loginForm" onsubmit="return handleSubmit()">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" required>
        
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" required>
        
        <button type="submit" class="btn" id="submitBtn">登录</button>
    </form>
    
    <div class="switch">
        <span id="switchText">还没有账号？</span>
        <a id="switchLink" onclick="toggleMode()">立即注册</a>
    </div>
</div>

<script>
    let isLogin = true;

    function toggleMode() {
        isLogin = !isLogin;
        document.getElementById('formTitle').textContent = isLogin ? '登录你的账号' : '创建新账号';
        document.getElementById('submitBtn').textContent = isLogin ? '登录' : '注册';
        document.getElementById('switchText').textContent = isLogin ? '还没有账号？' : '已有账号？';
        document.getElementById('switchLink').textContent = isLogin ? '立即注册' : '去登录';
        document.getElementById('errorMsg').style.display = 'none';
    }

    function handleSubmit() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorEl = document.getElementById('errorMsg');

        if (!username || !password) {
            errorEl.textContent = '请填写用户名和密码';
            errorEl.style.display = 'block';
            return false;
        }

        const url = isLogin ? '/api/login' : '/api/register';
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                window.location.href = '/';
            } else {
                errorEl.textContent = data.error || '操作失败';
                errorEl.style.display = 'block';
            }
        })
        .catch(() => {
            errorEl.textContent = '网络错误，请重试';
            errorEl.style.display = 'block';
        });

        return false;
    }
</script>
</body>
</html>
