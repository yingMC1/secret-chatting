<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            color: #eee;
            min-height: 100vh;
            overflow: hidden;
            /* 兜底黑色，防止图片加载失败空白 */
            background: #000;
        }

        /* 底层全屏彩虹故障遮罩 铺满整个浏览器 */
        .hack-full-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999999;
            overflow: hidden;
            pointer-events: none;
        }
        .hack-full-mask img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: glitch-shift 0.2s infinite alternate;
        }
        @keyframes glitch-shift {
            0% { transform: translate(2px, 1px); }
            100% { transform: translate(-2px, -1px); }
        }

        /* 聊天窗口：左上角固定，永久最高层级 */
        .container {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 99999999;
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: #16213e;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.9);
        }

        .header {
            background: #0f3460;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a4a7a;
        }
        .header h2 { font-size: 18px; color: #e94560; }
        .header .user-info { display: flex; gap: 12px; align-items: center; font-size: 14px; }
        .header .user-info .admin-badge {
            background: #e94560;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #fff;
        }
        .header .logout-btn {
            background: #e94560;
            border: none;
            color: #fff;
            padding: 4px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .room-bar {
            background: #1a2a4a;
            padding: 10px 24px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid #1a4a7a;
            flex-wrap: wrap;
        }
        .room-bar .room-btn {
            background: #2a3a5a;
            border: none;
            color: #ccc;
            padding: 4px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }
        .room-bar .room-btn:hover { background: #3a4a6a; color: #fff; }
        .room-bar .room-btn.active { background: #e94560; color: #fff; }
        .room-bar .room-btn.join-btn { background: #0f6b4a; }
        .room-bar .room-btn.join-btn:hover { background: #0f8a5a; }
        .messages {
            flex: 1;
            padding: 16px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #1a1a2e;
        }
        .messages .msg {
            padding: 6px 12px;
            border-radius: 8px;
            max-width: 75%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }
        .messages .msg.self { align-self: flex-end; background: #0f3460; }
        .messages .msg.other { align-self: flex-start; background: #2a2a4a; }
        .messages .msg.system {
            align-self: center;
            background: #2a1a2a;
            color: #aaa;
            font-size: 12px;
            padding: 4px 16px;
            border-radius: 12px;
            max-width: 90%;
            text-align: center;
        }
        .messages .msg .time { font-size: 10px; color: #888; margin-left: 8px; }
        .messages .msg .username { font-weight: bold; color: #e94560; font-size: 13px; }
        .input-area {
            display: flex;
            padding: 12px 24px;
            background: #0f3460;
            border-top: 1px solid #1a4a7a;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #1a2a4a;
            color: #eee;
            font-size: 14px;
            outline: none;
        }
        .input-area input::placeholder { color: #6688aa; }
        .input-area button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: #e94560;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }
        .input-area button:hover { background: #c73652; }
        .admin-link {
            background: #0f6b4a;
            padding: 4px 14px;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
        }
        .admin-link:hover { background: #0f8a5a; }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .container {
                top: 0;
                left: 0;
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
                width: 100%;
            }
            .header { flex-wrap: wrap; gap: 8px; }
            .room-bar { padding: 8px 12px; }
            .messages { padding: 12px 12px; }
            .input-area { padding: 8px 12px; }
        }
    </style>
</head>
<body>
    <!-- 底层全屏故障背景 -->
    <div class="hack-full-mask">
        <img src="{{ url_for('static', filename='hack-glitch-full.png') }}" alt="你已被黑客入侵">
    </div>

    <!-- 左上角聊天窗口，永久顶层 -->
    <div class="container">
        <div class="header">
            <h2>💬 聊天室</h2>
            <div class="user-info">
                <span id="currentUser">{{ username }}</span>
                {% if is_admin %}<span class="admin-badge">管理员</span>{% endif %}
                {% if is_admin %}<a href="/admin" class="admin-link">管理后台</a>{% endif %}
                <button class="logout-btn" onclick="logout()">退出</button>
            </div>
        </div>
        <div class="room-bar" id="roomBar">
            <span style="color:#888;font-size:13px;">房间：</span>
            {% for room in rooms %}
            <button class="room-btn {% if loop.first %}active{% endif %}" data-room="{{ room }}" onclick="switchRoom('{{ room }}')">{{ room }}</button>
            {% endfor %}
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

<script>
    const username = '{{ username }}';
    const isAdmin = {{ 'true' if is_admin else 'false' }};
    let currentRoom = 'public';
    const socket = io();

    socket.emit('join', { room: currentRoom });

    socket.on('new_message', function(data) {
        appendMessage(data.username, data.content, data.timestamp, data.username === username);
    });

    socket.on('system_message', function(data) {
        appendSystemMessage(data.content);
    });

    socket.on('room_joined', function(data) {
        appendSystemMessage('已加入房间: ' + data.room);
    });

    socket.on('clear_room', function(room) {
        if (room === currentRoom) {
            document.getElementById('messages').innerHTML = '';
            appendSystemMessage('聊天记录已被管理员清空');
        }
    });

    socket.on('force_logout', function() {
        alert('您已被管理员封禁，将强制下线');
        window.location.href = '/login';
    });

    function appendMessage(sender, content, time, isSelf) {
        const div = document.createElement('div');
        div.className = 'msg ' + (isSelf ? 'self' : 'other');
        div.innerHTML = `<span class="username">${sender}</span> ${content} <span class="time">${time || ''}</span>`;
        document.getElementById('messages').appendChild(div);
        scrollToBottom();
    }

    function appendSystemMessage(content) {
        const div = document.createElement('div');
        div.className = 'msg system';
        div.textContent = content;
        document.getElementById('messages').appendChild(div);
        scrollToBottom();
    }

    function scrollToBottom() {
        const msgs = document.getElementById('messages');
        msgs.scrollTop = msgs.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const content = input.value.trim();
        if (!content) return;
        socket.emit('message', { room: currentRoom, content: content });
        input.value = '';
        input.focus();
    }

    function switchRoom(room) {
        if (room === currentRoom) return;
        socket.emit('leave', { room: currentRoom });
        currentRoom = room;
        socket.emit('join', { room: room });
        document.querySelectorAll('.room-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.room === room);
        });
        document.getElementById('messages').innerHTML = '';
        fetch(`/api/messages/${room}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(msg => {
                    appendMessage(msg.username, msg.content, msg.timestamp, msg.username === username);
                });
            });
    }

    function logout() {
        fetch('/api/logout', { method: 'POST' })
            .then(() => { window.location.href = '/login'; });
    }

    fetch(`/api/messages/public`)
        .then(res => res.json())
        .then(data => {
            data.forEach(msg => {
                appendMessage(msg.username, msg.content, msg.timestamp, msg.username === username);
            });
        });
</script>
</body>
</html>
