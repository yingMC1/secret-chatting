<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 聊天室</title>
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    
    <!-- Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- KaTeX 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- 自动渲染 KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #16213e;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #0f3460;
            padding: 20px 25px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e94560;
            flex-wrap: wrap;
            gap: 10px;
        }
        .chat-header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        .chat-header h1 span {
            color: #e94560;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .user-badge {
            background: #e94560;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }
        .admin-badge {
            background: #f5a623;
            color: #1a1a2e;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid #e94560;
            color: #e94560;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: #e94560;
            color: white;
        }
        .admin-btn {
            background: #f5a623;
            border: none;
            color: #1a1a2e;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .admin-btn:hover {
            background: #ffc107;
            transform: scale(1.05);
        }
        .messages {
            flex: 1;
            padding: 20px 25px;
            overflow-y: auto;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .messages::-webkit-scrollbar {
            width: 6px;
        }
        .messages::-webkit-scrollbar-track {
            background: #16213e;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 15px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.own {
            align-self: flex-end;
            background: #e94560;
            color: white;
            border-bottom-right-radius: 5px;
        }
        .message.other {
            align-self: flex-start;
            background: #0f3460;
            color: white;
            border-bottom-left-radius: 5px;
        }
        .message.system {
            align-self: center;
            background: #2d4059;
            color: #aaa;
            font-size: 13px;
            padding: 6px 18px;
            border-radius: 20px;
            max-width: 90%;
            text-align: center;
        }
        .message .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 4px;
            font-size: 12px;
        }
        .message .msg-username {
            font-weight: bold;
            color: #f5a623;
        }
        .message.own .msg-username {
            color: #ffe066;
        }
        .message .msg-time {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
        }
        .message .msg-content {
            font-size: 15px;
            line-height: 1.6;
        }
        /* Markdown 样式 */
        .message .msg-content p {
            margin: 4px 0;
        }
        .message .msg-content code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        .message .msg-content pre {
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 6px 0;
        }
        .message .msg-content pre code {
            background: none;
            padding: 0;
        }
        .message .msg-content blockquote {
            border-left: 3px solid #e94560;
            padding-left: 12px;
            margin: 6px 0;
            color: #aaa;
        }
        .message .msg-content a {
            color: #5bade3;
            text-decoration: none;
        }
        .message .msg-content a:hover {
            text-decoration: underline;
        }
        .message .msg-content ul, 
        .message .msg-content ol {
            padding-left: 20px;
            margin: 4px 0;
        }
        .message .msg-content table {
            border-collapse: collapse;
            margin: 6px 0;
            font-size: 13px;
        }
        .message .msg-content th,
        .message .msg-content td {
            border: 1px solid rgba(255,255,255,0.2);
            padding: 4px 10px;
        }
        .message .msg-content th {
            background: rgba(0,0,0,0.3);
        }
        .message .msg-content img {
            max-width: 100%;
            border-radius: 8px;
        }
        /* KaTeX 样式 */
        .message .msg-content .katex-display {
            margin: 8px 0;
            overflow-x: auto;
        }
        .message .msg-content .katex {
            font-size: 1.1em;
        }
        .message .delete-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: color 0.3s;
        }
        .message .delete-btn:hover {
            color: #ff4444;
        }
        .input-area {
            padding: 15px 25px;
            background: #16213e;
            border-top: 1px solid #2d4059;
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: #0f3460;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .input-area input:focus {
            background: #1a3a6a;
            box-shadow: 0 0 0 2px #e94560;
        }
        .input-area input::placeholder {
            color: #6a7a9a;
        }
        .input-area button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: #e94560;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .input-area button:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }
        .input-area button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        .room-info {
            background: #0f3460;
            padding: 8px 25px;
            color: #8a9aaa;
            font-size: 13px;
            border-bottom: 1px solid #1a3a6a;
            display: flex;
            justify-content: space-between;
        }
        .room-info .room-name {
            color: #e94560;
            font-weight: bold;
        }
        .typing-indicator {
            color: #8a9aaa;
            font-size: 13px;
            padding: 5px 25px;
            min-height: 25px;
            font-style: italic;
        }
        .format-hint {
            color: #6a7a9a;
            font-size: 12px;
            padding: 4px 25px 10px 25px;
            background: #16213e;
            border-top: 1px solid #0f3460;
        }
        .format-hint span {
            margin-right: 12px;
        }
        .format-hint code {
            background: #0f3460;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #e94560;
        }
        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
            .chat-header {
                padding: 15px 20px;
            }
            .chat-header h1 {
                font-size: 16px;
            }
            .messages {
                padding: 15px;
            }
            .input-area {
                padding: 12px 15px;
                flex-wrap: wrap;
            }
            .input-area input {
                font-size: 14px;
                padding: 10px 15px;
            }
            .input-area button {
                padding: 10px 20px;
                font-size: 14px;
                flex: 1;
            }
            .header-right {
                gap: 8px;
            }
            .format-hint {
                font-size: 11px;
                padding: 4px 15px 8px 15px;
            }
            .format-hint span {
                margin-right: 8px;
            }
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- 头部 -->
        <div class="chat-header">
            <h1>💬 <span>聊天室</span></h1>
            <div class="header-right">
                <span class="user-badge" id="currentUser">{{ username }}</span>
                {% if is_admin %}
                <span class="admin-badge">👑 管理员</span>
                <button class="admin-btn" onclick="location.href='/admin'">管理面板</button>
                {% endif %}
                <button class="logout-btn" onclick="logout()">退出</button>
            </div>
        </div>

        <!-- 房间信息 -->
        <div class="room-info">
            <span>📌 当前房间：<span class="room-name">public</span></span>
            <span id="onlineCount">👤 在线: 0</span>
        </div>

        <!-- 消息区域 -->
        <div class="messages" id="messages"></div>

        <!-- 正在输入提示 -->
        <div class="typing-indicator" id="typingIndicator"></div>

        <!-- 输入区域 -->
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="输入消息... 支持 Markdown 和 LaTeX" autofocus>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
        
        <!-- 格式提示 -->
        <div class="format-hint">
            <span>📝 <code>**粗体**</code></span>
            <span><code>*斜体*</code></span>
            <span><code>`代码`</code></span>
            <span><code>$$公式$$</code></span>
            <span><code># 标题</code></span>
            <span><code>- 列表</code></span>
            <span>🔒 HTML 已禁用</span>
        </div>
    </div>

    <script>
        const username = "{{ username }}";
        const isAdmin = {{ is_admin|tojson }};
        const room = 'public';
        let socket = null;

        // ========== 配置 marked（禁用 HTML）==========
        const renderer = new marked.Renderer();
        // 禁用 HTML 标签
        renderer.html = function(html) {
            return ''; // 完全忽略 HTML
        };
        
        marked.setOptions({
            renderer: renderer,
            breaks: true,
            gfm: true,
            headerIds: false,
            mangle: false
        });

        // ========== 渲染 Markdown + KaTeX ==========
        function renderContent(text) {
            if (!text) return '';
            
            // 先转义 HTML 特殊字符（防止注入）
            let safe = escapeHtml(text);
            
            // 提取并保护 KaTeX 公式（防止被 Markdown 处理）
            const formulas = [];
            // 块级公式 $$...$$
            safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, (match, formula) => {
                const idx = formulas.length;
                formulas.push({ type: 'block', content: formula });
                return `%%KATEX_BLOCK_${idx}%%`;
            });
            // 行内公式 $...$
            safe = safe.replace(/\$([^\$\n]+?)\$/g, (match, formula) => {
                const idx = formulas.length;
                formulas.push({ type: 'inline', content: formula });
                return `%%KATEX_INLINE_${idx}%%`;
            });
            
            // 使用 marked 渲染 Markdown
            let html = marked.parse(safe);
            
            // 恢复 KaTeX 公式并渲染
            formulas.forEach((f, idx) => {
                const placeholder = f.type === 'block' 
                    ? `%%KATEX_BLOCK_${idx}%%`
                    : `%%KATEX_INLINE_${idx}%%`;
                try {
                    let rendered;
                    if (f.type === 'block') {
                        rendered = katex.renderToString(f.content, {
                            displayMode: true,
                            throwOnError: false,
                            trust: false
                        });
                    } else {
                        rendered = katex.renderToString(f.content, {
                            displayMode: false,
                            throwOnError: false,
                            trust: false
                        });
                    }
                    html = html.replace(placeholder, rendered);
                } catch (e) {
                    html = html.replace(placeholder, `<code>错误公式: ${escapeHtml(f.content)}</code>`);
                }
            });
            
            return html;
        }

        // ========== 初始化 Socket ==========
        function initSocket() {
            socket = io({
                transports: ['websocket', 'polling']
            });

            socket.on('connect', () => {
                console.log('✅ 已连接到服务器');
                socket.emit('join', { room: room });
                fetch('/api/online_count', { credentials: 'include' })
                    .then(r => r.json())
                    .then(data => {
                        document.getElementById('onlineCount').textContent = `👤 在线: ${data.count}`;
                    })
                    .catch(err => console.error('获取在线人数失败:', err));
            });

            socket.on('disconnect', () => {
                console.log('❌ 断开连接');
            });

            socket.on('new_message', (data) => {
                addMessage(data, data.username === username);
            });

            socket.on('system_message', (data) => {
                addSystemMessage(data.content);
            });

            socket.on('message_deleted', (data) => {
                const el = document.querySelector(`.message[data-id="${data.id}"]`);
                if (el) el.remove();
            });

            socket.on('clear_room', () => {
                document.getElementById('messages').innerHTML = '';
            });

            socket.on('force_logout', () => {
                alert('您已被管理员强制下线');
                logout();
            });

            socket.on('online_count', (data) => {
                document.getElementById('onlineCount').textContent = `👤 在线: ${data.count}`;
            });
        }

        // ========== 添加消息 ==========
        function addMessage(data, isOwn) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'own' : 'other'}`;
            div.dataset.id = data.id;
            
            const time = new Date(data.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            const deleteBtn = (isOwn || isAdmin) ? 
                `<button class="delete-btn" onclick="deleteMessage(${data.id})">✕</button>` : '';
            
            // 渲染内容
            const renderedHtml = renderContent(data.content);
            
            div.innerHTML = `
                <div class="msg-header">
                    <span class="msg-username">${escapeHtml(data.username)}</span>
                    <span class="msg-time">${time}</span>
                    ${deleteBtn}
                </div>
                <div class="msg-content">${renderedHtml}</div>
            `;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(content) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message system';
            div.textContent = content;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // ========== 发送消息 ==========
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !socket) return;

            socket.emit('message', {
                room: room,
                content: content
            });
            input.value = '';
            input.focus();
        }

        // ========== 删除消息 ==========
        function deleteMessage(msgId) {
            if (!confirm('确定要删除这条消息吗？')) return;
            fetch(`/api/delete_message/${msgId}`, {
                method: 'DELETE',
                credentials: 'include'
            })
            .then(r => r.json())
            .then(data => {
                if (!data.success) alert(data.error || '删除失败');
            })
            .catch(err => alert('删除失败: ' + err));
        }

        // ========== 退出登录 ==========
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                fetch('/api/logout', {
                    method: 'POST',
                    credentials: 'include'
                })
                .then(() => {
                    if (socket) socket.disconnect();
                    window.location.href = '/login';
                })
                .catch(() => {
                    window.location.href = '/login';
                });
            }
        }

        // ========== 工具函数 ==========
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== 加载历史消息 ==========
        function loadMessages() {
            fetch(`/api/messages/${room}`, {
                credentials: 'include'
            })
            .then(r => r.json())
            .then(data => {
                if (Array.isArray(data)) {
                    const container = document.getElementById('messages');
                    container.innerHTML = '';
                    data.forEach(msg => {
                        addMessage(msg, msg.username === username);
                    });
                }
            })
            .catch(err => console.error('加载消息失败:', err));
        }

        // ========== 键盘事件 ==========
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // ========== 启动 ==========
        initSocket();
        loadMessages();
    </script>
</body>
</html>
