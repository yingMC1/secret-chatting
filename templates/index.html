<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 聊天室</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0e1219;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 92vh;
            background: #181f2b;
            border-radius: 32px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .chat-header {
            background: #1f2a3a;
            padding: 18px 28px;
            color: #f0f4fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3648;
            flex-wrap: wrap;
            gap: 12px;
        }
        .chat-header h1 { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .chat-header h1 span { background: #3b4d66; padding: 2px 14px; border-radius: 30px; font-size: 13px; font-weight: 400; color: #9bb1cc; }
        .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .user-badge { background: #2e3d52; padding: 6px 18px; border-radius: 30px; font-size: 14px; font-weight: 500; color: #d6e3f0; }
        .admin-badge { background: #9b59b6; color: #fff; padding: 3px 14px; border-radius: 30px; font-size: 12px; font-weight: 600; }
        .logout-btn { background: transparent; border: 1px solid #4a5f7a; color: #b0c8e0; padding: 6px 20px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
        .logout-btn:hover { background: #4a5f7a; color: #fff; border-color: #6a8aaa; }
        .admin-btn { background: #9b59b6; border: none; color: #fff; padding: 6px 18px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.2s; }
        .admin-btn:hover { background: #b06fd6; }
        .room-info { background: #141c28; padding: 10px 28px; color: #8aa1bc; font-size: 13px; display: flex; justify-content: space-between; border-bottom: 1px solid #1f2a3a; }
        .room-info .room-name { color: #5b8cbf; font-weight: 600; }
        .room-info .online-count { background: #1f2a3a; padding: 2px 14px; border-radius: 20px; font-size: 12px; color: #7fd1b0; }
        .messages { flex: 1; padding: 24px 28px; overflow-y: auto; background: #181f2b; display: flex; flex-direction: column; gap: 6px; }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-track { background: #1f2a3a; }
        .messages::-webkit-scrollbar-thumb { background: #3b4d66; border-radius: 10px; }
        .message { max-width: 78%; padding: 10px 18px; border-radius: 20px; word-wrap: break-word; animation: fadeIn 0.25s ease; line-height: 1.6; font-size: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.own { align-self: flex-end; background: #2b6f9c; color: #f0f8ff; border-bottom-right-radius: 6px; }
        .message.other { align-self: flex-start; background: #24303e; color: #e5edf5; border-bottom-left-radius: 6px; }
        .message.system { align-self: center; background: #1f2a3a; color: #7f96b0; font-size: 13px; padding: 6px 22px; border-radius: 30px; max-width: 92%; text-align: center; box-shadow: none; }
        .message .msg-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 2px; font-size: 12px; }
        .message .msg-username { font-weight: 600; color: #e8b87a; cursor: pointer; transition: color 0.2s; }
        .message .msg-username:hover { color: #f5d6a8; text-decoration: underline; }
        .message .msg-username.admin { color: #b07cd8 !important; }
        .message.own .msg-username { color: #ffd966; }
        .message .msg-time { color: rgba(255,255,255,0.35); font-size: 11px; font-weight: 400; }
        .message .msg-content { white-space: pre-wrap; word-wrap: break-word; margin-top: 2px; }
        .message .msg-content p { margin: 4px 0; }
        .message .msg-content code { background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 6px; font-size: 13px; font-family: 'JetBrains Mono', monospace; }
        .message .msg-content pre { background: rgba(0,0,0,0.4); padding: 10px 14px; border-radius: 12px; overflow-x: auto; margin: 6px 0; white-space: pre-wrap; }
        .message .msg-content blockquote { border-left: 3px solid #5b8cbf; padding-left: 14px; margin: 6px 0; color: #aabed6; }
        .message .msg-content a { color: #7fc1f0; text-decoration: none; }
        .message .msg-content a:hover { text-decoration: underline; }
        .message .msg-content .mention { color: #f5a623; background: rgba(245,166,35,0.15); padding: 1px 6px; border-radius: 6px; font-weight: 600; }
        .message .msg-content .katex-display { margin: 8px 0; overflow-x: auto; }
        .message .delete-btn { background: none; border: none; color: rgba(255,255,255,0.25); cursor: pointer; font-size: 13px; padding: 0 4px; transition: color 0.2s; }
        .message .delete-btn:hover { color: #ff6b6b; }
        .input-area { padding: 16px 28px 20px 28px; background: #141c28; border-top: 1px solid #1f2a3a; display: flex; gap: 14px; align-items: flex-end; }
        .input-wrapper { flex: 1; position: relative; display: flex; align-items: flex-end; }
        .input-wrapper textarea { width: 100%; padding: 12px 18px; border: none; border-radius: 30px; background: #1f2a3a; color: #e5edf5; font-size: 15px; outline: none; resize: none; min-height: 52px; max-height: 160px; font-family: inherit; line-height: 1.6; transition: background 0.2s, box-shadow 0.2s; }
        .input-wrapper textarea:focus { background: #283649; box-shadow: 0 0 0 2px #3b6a94; }
        .input-wrapper textarea::placeholder { color: #5e748e; }
        .input-wrapper .mention-suggest { position: absolute; bottom: 100%; left: 0; background: #1f2a3a; border-radius: 16px; padding: 6px 0; min-width: 160px; max-height: 150px; overflow-y: auto; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #2a3648; z-index: 100; }
        .input-wrapper .mention-suggest .suggest-item { padding: 8px 18px; color: #d6e3f0; cursor: pointer; transition: background 0.15s; }
        .input-wrapper .mention-suggest .suggest-item:hover { background: #2e405a; }
        .input-area .send-btn { padding: 12px 30px; border: none; border-radius: 30px; background: #2b6f9c; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; flex-shrink: 0; height: 52px; display: flex; align-items: center; justify-content: center; }
        .input-area .send-btn:hover { background: #3b86b8; }
        .input-area .send-btn:active { transform: scale(0.96); }
        .format-hint { color: #4d657f; font-size: 12px; padding: 8px 28px 14px 28px; background: #141c28; border-top: 1px solid #1a2330; display: flex; flex-wrap: wrap; gap: 6px 16px; }
        .format-hint code { background: #1f2a3a; padding: 1px 8px; border-radius: 6px; font-size: 12px; color: #9bb1cc; }
        .format-hint .key { color: #6a8aaa; font-weight: 500; }
        @media (max-width: 600px) {
            body { padding: 8px; }
            .chat-container { height: 96vh; border-radius: 20px; }
            .chat-header { padding: 14px 18px; }
            .chat-header h1 { font-size: 18px; }
            .room-info { padding: 8px 18px; font-size: 12px; }
            .messages { padding: 16px 18px; }
            .input-area { padding: 12px 18px 16px; flex-wrap: wrap; }
            .input-area .send-btn { height: 48px; padding: 0 24px; font-size: 14px; }
            .format-hint { padding: 6px 18px 12px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>💬 聊天室 <span>public</span></h1>
            <div class="header-right">
                <span class="user-badge" id="currentUser">{{ username }}</span>
                {% if is_admin %}
                <span class="admin-badge">👑 管理员</span>
                <button class="admin-btn" onclick="location.href='/admin'">管理面板</button>
                {% endif %}
                <button class="logout-btn" onclick="logout()">退出</button>
            </div>
        </div>
        <div class="room-info">
            <span>📌 当前房间：<span class="room-name">public</span></span>
            <span class="online-count" id="onlineCount">👤 在线: 0</span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="输入消息... @用户名 提及他人" rows="1"></textarea>
                <div class="mention-suggest" id="mentionSuggest"></div>
            </div>
            <button class="send-btn" onclick="sendMessage()">发送</button>
        </div>
        <div class="format-hint">
            <span>📝 <code>**粗体**</code> <code>*斜体*</code> <code>`代码`</code> <code>$$公式$$</code></span>
            <span>🔗 <code>@用户名</code> 提及</span>
            <span><span class="key">Shift+Enter</span> 换行</span>
            <span><span class="key">Enter</span> 发送</span>
            <span>🔒 HTML 已禁用</span>
        </div>
    </div>

    <script>
        // ===== 设备 ID 管理（用于注册/封禁）=====
        function getDeviceId() {
            let id = localStorage.getItem('deviceId');
            if (!id) {
                id = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
                localStorage.setItem('deviceId', id);
            }
            return id;
        }

        // ===== 注册时自动发送 device_id =====
        // 覆盖原有的注册函数（如果存在），或者直接在新注册流程中使用
        // 本页面本身没有注册表单，但登录页（login.html）可能调用注册API。
        // 为了全局生效，我们在页面加载时挂载一个辅助函数，供login.html调用。
        // 但login.html是独立页面，我们可以修改login.html，但更简单：
        // 让 login.html 也使用此脚本中的 getDeviceId，并修改其注册请求。
        // 由于 login.html 通常独立，这里我们提供一个全局函数供登录页使用。
        window.getDeviceId = getDeviceId;

        // 如果您的 login.html 也使用此脚本，请在注册请求中加入 device_id。
        // 示例：在 login.html 的注册请求中，添加 body 参数 device_id: getDeviceId()

        // ===== 聊天室逻辑 =====
        const username = "{{ username }}";
        const isAdmin = {{ is_admin|tojson }};
        const room = 'public';
        let socket = null;
        let allUsers = [];
        let adminUsers = [];
        let reconnectAttempts = 0;
        const MAX_RECONNECT = 5;

        function loadAdminUsers() {
            fetch('/api/admin_users', { credentials: 'include' })
                .then(r => r.json())
                .then(data => { adminUsers = data; })
                .catch(() => {});
        }

        function loadAllUsers() {
            fetch('/api/users', { credentials: 'include' })
                .then(r => r.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        allUsers = data.map(u => u.username);
                    }
                })
                .catch(err => console.error('加载用户列表失败:', err));
        }

        const renderer = new marked.Renderer();
        renderer.html = function(html) { return ''; };
        marked.setOptions({ renderer, breaks: true, gfm: true, headerIds: false, mangle: false });

        function renderContent(text) {
            if (!text) return '';
            let safe = escapeHtml(text);
            safe = safe.replace(/@(\w+)/g, (match, name) => `<span class="mention">@${escapeHtml(name)}</span>`);
            const formulas = [];
            safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, (match, formula) => {
                const idx = formulas.length;
                formulas.push({ type: 'block', content: formula });
                return `%%KATEX_BLOCK_${idx}%%`;
            });
            safe = safe.replace(/\$([^\$\n]+?)\$/g, (match, formula) => {
                const idx = formulas.length;
                formulas.push({ type: 'inline', content: formula });
                return `%%KATEX_INLINE_${idx}%%`;
            });
            let html = marked.parse(safe);
            formulas.forEach((f, idx) => {
                const placeholder = f.type === 'block' ? `%%KATEX_BLOCK_${idx}%%` : `%%KATEX_INLINE_${idx}%%`;
                try {
                    const rendered = katex.renderToString(f.content, {
                        displayMode: f.type === 'block',
                        throwOnError: false,
                        trust: false
                    });
                    html = html.replace(placeholder, rendered);
                } catch (e) {
                    html = html.replace(placeholder, `<code>错误公式: ${escapeHtml(f.content)}</code>`);
                }
            });
            return html;
        }

        function initSocket() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }
            socket = io({
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: MAX_RECONNECT,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000
            });

            socket.on('connect', () => {
                console.log('✅ 已连接到服务器');
                reconnectAttempts = 0;
                socket.emit('join', { room: room });
                fetch('/api/online_count', { credentials: 'include' })
                    .then(r => r.json())
                    .then(data => {
                        document.getElementById('onlineCount').textContent = `👤 在线: ${data.count}`;
                    })
                    .catch(err => console.error('获取在线人数失败:', err));
            });

            socket.on('connect_error', (err) => {
                console.error('❌ 连接错误:', err);
                reconnectAttempts++;
                if (reconnectAttempts >= MAX_RECONNECT) {
                    alert('无法连接到服务器，请刷新页面重试。');
                }
            });

            socket.on('disconnect', () => {
                console.log('❌ 断开连接');
            });

            socket.on('new_message', (data) => {
                addMessage(data, data.username === username);
            });

            socket.on('system_message', (data) => {
                addSystemMessage(data.content);
            });

            socket.on('message_deleted', (data) => {
                const el = document.querySelector(`.message[data-id="${data.id}"]`);
                if (el) el.remove();
            });

            socket.on('force_logout', () => {
                alert('您已被管理员强制下线');
                logout();
            });

            socket.on('online_count', (data) => {
                document.getElementById('onlineCount').textContent = `👤 在线: ${data.count}`;
            });
        }

        function addMessage(data, isOwn) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'own' : 'other'}`;
            div.dataset.id = data.id;

            const time = new Date(data.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            let showDelete = false;
            if (data.username === 'yingMC') {
                showDelete = (username === 'yingMC');
            } else {
                showDelete = isAdmin || data.username === username;
            }
            const deleteBtn = showDelete ? `<button class="delete-btn" onclick="deleteMessage(${data.id})">✕</button>` : '';

            const isAdminUser = adminUsers.includes(data.username);
            const adminClass = isAdminUser ? 'admin' : '';

            const renderedHtml = renderContent(data.content);

            div.innerHTML = `
                <div class="msg-header">
                    <span class="msg-username ${adminClass}" onclick="mentionUser('${escapeHtml(data.username)}')">${escapeHtml(data.username)}</span>
                    <span class="msg-time">${time}</span>
                    ${deleteBtn}
                </div>
                <div class="msg-content">${renderedHtml}</div>
            `;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(content) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message system';
            div.textContent = content;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function mentionUser(name) {
            const input = document.getElementById('messageInput');
            input.focus();
            const current = input.value;
            const pos = input.selectionStart || current.length;
            const before = current.substring(0, pos);
            const after = current.substring(pos);
            if (before.endsWith('@')) {
                input.value = before.substring(0, before.length - 1) + `@${name} ` + after;
            } else {
                input.value = current + ` @${name}`;
            }
            input.setSelectionRange(input.value.length, input.value.length);
            autoResize(input);
            hideMentionSuggest();
        }

        function showMentionSuggest(query) {
            const suggest = document.getElementById('mentionSuggest');
            if (!query || query.length === 0) {
                suggest.style.display = 'none';
                return;
            }
            const matches = allUsers.filter(u =>
                u.toLowerCase().includes(query.toLowerCase()) &&
                u !== username
            );
            if (matches.length === 0) {
                suggest.style.display = 'none';
                return;
            }
            suggest.innerHTML = '';
            matches.forEach((name, idx) => {
                const item = document.createElement('div');
                item.className = 'suggest-item';
                item.textContent = `@${name}`;
                item.onclick = () => mentionUser(name);
                suggest.appendChild(item);
            });
            suggest.style.display = 'block';
        }

        function hideMentionSuggest() {
            document.getElementById('mentionSuggest').style.display = 'none';
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value;
            if (!content.trim() || !socket) return;
            socket.emit('message', { room: room, content: content });
            input.value = '';
            autoResize(input);
            input.focus();
            hideMentionSuggest();
        }

        function deleteMessage(msgId) {
            if (!confirm('确定要删除这条消息吗？')) return;
            fetch(`/api/delete_message/${msgId}`, { method: 'DELETE', credentials: 'include' })
                .then(r => r.json())
                .then(data => {
                    if (!data.success) alert(data.error || '删除失败');
                })
                .catch(err => alert('删除失败: ' + err));
        }

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                fetch('/api/logout', { method: 'POST', credentials: 'include' })
                    .then(() => {
                        if (socket) socket.disconnect();
                        window.location.href = '/login';
                    })
                    .catch(() => window.location.href = '/login');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function loadMessages() {
            fetch(`/api/messages/${room}`, { credentials: 'include' })
                .then(r => r.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        const container = document.getElementById('messages');
                        container.innerHTML = '';
                        data.forEach(msg => addMessage(msg, msg.username === username));
                    }
                })
                .catch(err => console.error('加载消息失败:', err));
        }

        const textarea = document.getElementById('messageInput');
        textarea.addEventListener('input', function(e) {
            autoResize(this);
            const value = this.value;
            const cursorPos = this.selectionStart;
            const beforeCursor = value.substring(0, cursorPos);
            const atMatch = beforeCursor.match(/@([^\s]*)$/);
            if (atMatch) {
                showMentionSuggest(atMatch[1]);
            } else {
                hideMentionSuggest();
            }
        });

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.input-wrapper')) {
                hideMentionSuggest();
            }
        });

        loadAdminUsers();
        loadAllUsers();
        initSocket();
        loadMessages();
    </script>
</body>
</html>
